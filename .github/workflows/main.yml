name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  Ubuntu_cmake:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get -y install git gcc g++ make lcov wget libpthread-stubs0-dev
    - name: Configure CMake
      run: |
        mkdir cmake
        cd cmake
        wget https://github.com/Kitware/CMake/releases/download/v3.16.5/cmake-3.16.5-Linux-x86_64.sh
        chmod +x cmake-3.16.5-Linux-x86_64.sh
        ./cmake-3.16.5-Linux-x86_64.sh --skip-license
        cd ../
        mkdir cmake-cache
        cd cmake-cache
        ../cmake/bin/cmake -DGCOV=ON ..
    - name: Build mesh
      run: |
        cd cmake-cache
        make all
    - name: Run tests
      run: |
       cd cmake-cache
       make coverage_gcc

  # Mesh's write barrier in each mode (src/write_barrier.h).  The userfaultfd
  # modes need Linux 5.19+ (uffd-wp on shmem); "uffd" also needs kernel-mode
  # faults, enabled here via vm.unprivileged_userfaultfd=1.
  Ubuntu_write_barrier:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        barrier: [mprotect, uffd-user, uffd]
    env:
      MESH_BARRIER: ${{ matrix.barrier }}
    steps:
    - uses: actions/checkout@v4
    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get -y install gcc g++ make cmake
    - name: Kernel and userfaultfd configuration
      run: |
        uname -r
        if [ "$MESH_BARRIER" = uffd ]; then
          sudo sysctl -w vm.unprivileged_userfaultfd=1
        fi
        sysctl vm.unprivileged_userfaultfd
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        # googletest is an ExternalProject; a parallel build can race it
        cmake --build build -j"$(nproc)" || cmake --build build -j1
    - name: Unit tests
      run: |
        build/bin/unit.test 2>&1 | tee unit.log
        test "${PIPESTATUS[0]}" -eq 0
        # the requested mode must actually be in effect (no silent fallback)
        grep -q "write barrier mode: $MESH_BARRIER\$" unit.log
    - name: userfaultfd protocol probe
      if: matrix.barrier != 'mprotect'
      run: |
        g++ -O2 -std=c++17 -pthread -Wall src/testing/uffd-barrier-probe.cc -o uffd-barrier-probe
        if [ "$MESH_BARRIER" = uffd ]; then ./uffd-barrier-probe; else ./uffd-barrier-probe --user-mode-only; fi
    - name: End-to-end stress (LD_PRELOAD)
      run: |
        g++ -O2 -std=c++17 -pthread -Wall src/testing/mesh-barrier-stress.cc -o mesh-barrier-stress -ldl
        LD_PRELOAD="$PWD/build/lib/libmesh.so" MALLOCSTATS=1 ./mesh-barrier-stress 10 2>&1 | tee stress.log
        test "${PIPESTATUS[0]}" -eq 0
        grep -q "^barrier: $MESH_BARRIER\$" stress.log

  # The Mesh paper's Redis experiment (sec. 6.2.2), on Redis and Valkey:
  # checks that meshing happens and reduces memory vs. Mesh with meshing
  # disabled, and reports jemalloc / jemalloc+activedefrag / glibc alongside.
  # Runs as root so each server gets its own memory cgroup (as in the paper's
  # mstat); servers bind to 127.0.0.1 only.
  Ubuntu_kv_fragmentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install required packages
      run: |
        sudo apt-get update
        sudo apt-get -y install gcc g++ make cmake python3
    - name: Build Mesh
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j"$(nproc)" --target mesh
    - name: Cache Redis/Valkey builds
      uses: actions/cache@v4
      with:
        path: bench/kv/build/bin
        key: kv-servers-${{ runner.os }}-${{ hashFiles('bench/kv/build-servers.sh') }}
    - name: Build Redis and Valkey
      run: bench/kv/build-servers.sh
    - name: Fragmentation benchmark
      run: |
        sudo --preserve-env=GITHUB_STEP_SUMMARY python3 bench/kv/fragmentation.py \
          --libmesh build/lib/libmesh.so --json kv-fragmentation.json --check
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kv-fragmentation
        path: kv-fragmentation.json

  Ubuntu_bazel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Install gold linker
        run: sudo apt-get update && sudo apt-get -y install binutils-gold
      - name: build in debug mode
        run: |
          ./bazel test -c dbg //src:unit-tests //src:high-offset-mesh-test
      - name: build tests and binary
        run: |
          make -j1
      - name: run benchmark (catches IFUNC static linking issues)
        run: |
          make benchmark

  macOS_bazel:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v1
    - name: build in debug mode
      run: |
        ./bazel test -c dbg //src:unit-tests //src:high-offset-mesh-test --test_output=all
    - name: build tests and binary
      run: |
        make -j1
    - name: run benchmark
      run: |
        make benchmark

